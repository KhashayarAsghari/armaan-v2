# Full production stack for the VPS: app + MinIO + nginx (reverse proxy/TLS).
#
# The MySQL database is intentionally NOT here — it should run directly on
# the host (or as a managed service). See docs/DEPLOYMENT.md for why and how
# the app container reaches it via `host.docker.internal`.
#
# Quick start: see docs/DEPLOYMENT.md for the full step-by-step guide.
#   1. cp .env.example .env   (fill in real values, including DOMAIN + CERTBOT_EMAIL)
#   2. ./nginx/init-letsencrypt.sh     (one-time: bootstraps the TLS certificate)
#   3. docker compose up -d --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: armaan-app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    # The app connects out to MySQL running on the host itself.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - armaan-network
    # No ports published to the host — only nginx (below) reaches it, over
    # the internal docker network.
    expose:
      - '3000'

  minio:
    image: minio/minio:latest
    container_name: armaan-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - armaan-network
    # Not published to the host on purpose — the app reaches MinIO's S3 API
    # over the internal network and proxies files to browsers itself
    # (app/api/media/[...key]/route.ts), so the bucket never needs to be
    # public. To reach the admin console when you need it, use an SSH tunnel:
    #   ssh -L 9001:localhost:9001 <user>@<server-ip>
    # then open http://localhost:9001 on your own machine.
    ports:
      - '127.0.0.1:9001:9001'

  # One-shot helper that creates the app's bucket automatically on first start.
  minio-init:
    image: minio/mc:latest
    container_name: armaan-minio-init
    depends_on:
      - minio
    restart: 'no'
    networks:
      - armaan-network
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env} ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}; do sleep 2; done;
      mc mb --ignore-existing local/${MINIO_BUCKET:-armaan-uploads};
      echo 'Bucket ready: ${MINIO_BUCKET:-armaan-uploads}';
      "

  nginx:
    image: nginx:1.27-alpine
    container_name: armaan-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. example.com}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - armaan-network
    # Reload nginx every 6h to pick up renewed certificates (certbot renews,
    # this just makes nginx re-read them without manual intervention).
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:latest
    container_name: armaan-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Tries to renew twice a day (a no-op unless the cert is close to expiry),
    # matching Certbot's own recommendation.
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

networks:
  armaan-network:
    driver: bridge

volumes:
  minio_data:
    driver: local
  certbot_certs:
    driver: local
  certbot_www:
    driver: local
