# Shared reverse-proxy settings, included from nginx/templates/app.conf.template.
# This file has no ${VARS} so it's mounted straight into /etc/nginx/conf.d/
# (not through the envsubst template pipeline).

proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

proxy_cache_bypass $http_upgrade;

# Give large video uploads (up to 110m, see nginx.conf) enough time.
proxy_connect_timeout 60s;
proxy_send_timeout    120s;
proxy_read_timeout    120s;
